name: Deploy verified Snapicorn to production

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'snapicorn/snapicorn.github.io' && github.ref == 'refs/heads/pages-release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release files and notices
        shell: bash
        run: |
          printf '%s  SHA256SUMS\n' 2329944b9727f2af1d13d1f781109ad884bc14e868b5d9071ab7dc541ad10977 | sha256sum --check --strict
          test "$(wc -l < SHA256SUMS)" -eq 42
          test -d site && test ! -L site
          test -z "$(find site \( ! -type f ! -type d -o -type f -links +1 \) -print)"
          for notice in dm-sans-OFL.txt fraunces-OFL.txt phosphor-MIT.txt; do
            test -s "site/assets/licenses/$notice"
          done
          (cd site && find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 -r sha256sum) > "$RUNNER_TEMP/site-sha256"
          diff -u SHA256SUMS "$RUNNER_TEMP/site-sha256"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
